name: Generate profile SVGs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Snake contribution animation ---
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Bsgg1
          outputs: |
            stats/snake-dark.svg?palette=github-dark
            stats/snake-light.svg?palette=github-light

      # --- 3D contribution graph ---
      - name: Generate 3D contrib
        uses: yoshi389111/github-profile-3d-contrib@0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Bsgg1

      # --- Stats cards (self-hosted, no external vercel) ---
      - name: Stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: stats/stats.svg
          plugin_languages: yes
          plugin_languages_limit: 8
      - name: Top languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: stats/top-langs.svg
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      # --- Single commit to avoid concurrent push races ---
      - name: Commit & push
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add stats profile-3d-contrib
          git commit -m "chore: update profile SVGs" || echo "no changes"
          git pull --rebase origin master || true
          git push
