name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Bsgg1
          outputs: |
            stats/snake-dark.svg?palette=github-dark
            stats/snake-light.svg?palette=github-light

      - name: Push
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update snake contribution"
